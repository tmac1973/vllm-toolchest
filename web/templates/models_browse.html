{{define "content"}}
<h1>Search HuggingFace</h1>

<div id="downloads-panel"
     hx-get="/api/hf/downloads"
     hx-trigger="load, every 3s, downloadsChanged from:body"
     hx-swap="innerHTML"
     hx-on::before-swap="if(event.detail.xhr.responseText===this.innerHTML){event.detail.shouldSwap=false;}">
</div>

<div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-bottom:0.5rem;">
    <input type="search"
           name="q"
           id="hf-search-input"
           value="{{.Query}}"
           placeholder="Search models (e.g., llama 3.1 8b, qwen2.5, mistral nemo...)"
           hx-get="/api/hf/search"
           hx-trigger="input changed delay:400ms, search"
           hx-target="#search-results"
           hx-include="#quant-filter"
           hx-indicator="#search-spinner"
           style="margin:0;flex:1;min-width:200px;">
    <select name="quant" id="quant-filter" style="width:auto;margin:0;"
            onchange="var input=document.getElementById('hf-search-input');if(input.value)htmx.trigger(input,'search');">
        {{- range .QuantFilters}}
        <option value="{{.Value}}">{{.Label}}</option>
        {{- end}}
    </select>
    <span id="search-spinner" class="htmx-indicator" aria-busy="true">Searching...</span>
</div>
{{if .Query}}
{{/* Arriving with ?q= should show results, not a filled box waiting for a
     keystroke. htmx's "input changed" trigger will not fire for a value that
     was there when the page loaded, so nudge it once. */}}
<script>
(function () {
    var input = document.getElementById('hf-search-input');
    if (input && input.value) htmx.trigger(input, 'search');
})();
</script>
{{end}}

<div id="search-results"></div>
{{end}}
