{{define "content"}}
<h1>Service</h1>

<article>
    <header>vLLM Status</header>
    <div id="service-status"
         hx-get="/api/service/status"
         hx-trigger="every 3s"
         hx-swap="innerHTML">
        <p>Loading status...</p>
    </div>

    <div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;align-items:center;">
        <select name="model_id" id="model-select" style="width:auto;margin:0;">
            <option value="">Select a model...</option>
        </select>
        <button hx-post="/api/service/start"
                hx-include="#model-select"
                hx-target="#service-action-result"
                hx-swap="innerHTML">Start</button>
        <button class="secondary" hx-post="/api/service/stop" hx-target="#service-action-result" hx-swap="innerHTML">Stop</button>
        <button class="secondary outline" hx-post="/api/service/restart" hx-target="#service-action-result" hx-swap="innerHTML">Restart</button>
    </div>
    <div id="service-action-result" style="margin-top:0.5rem;"></div>
</article>

<article>
    <header>
        Logs
        <span style="float:right;font-size:0.75rem;">
            <label style="display:inline;"><input type="checkbox" class="log-tail-toggle" checked> Auto-scroll</label>
        </span>
    </header>
    <div>
        <pre id="service-logs"
             style="max-height:400px;overflow-y:auto;font-size:0.75rem;padding:0.5rem;background:var(--pico-code-background-color);border-radius:0.25rem;">No logs yet.</pre>
        <div style="margin-top:0.25rem;display:flex;gap:0.5rem;">
            <button class="secondary outline log-copy-btn" style="padding:0.15rem 0.5rem;font-size:0.75rem;">Copy</button>
            <button class="secondary outline" style="padding:0.15rem 0.5rem;font-size:0.75rem;"
                    onclick="fetch('/api/service/logs',{method:'DELETE'}).then(function(){document.getElementById('service-logs').textContent='';});">Clear</button>
        </div>
    </div>
</article>

<script>
// Log polling that respects auto-scroll toggle
(function() {
    var pre = document.getElementById('service-logs');
    var toggle = document.querySelector('.log-tail-toggle');
    var lastContent = '';

    function fetchLogs() {
        fetch('/api/service/logs', {headers: {'HX-Request': 'true'}})
            .then(function(r) { return r.text(); })
            .then(function(text) {
                if (text !== lastContent) {
                    lastContent = text;
                    pre.textContent = text || 'No logs yet.';
                    if (toggle && toggle.checked) {
                        pre.scrollTop = pre.scrollHeight;
                    }
                }
            })
            .catch(function() {});
    }

    fetchLogs();
    setInterval(fetchLogs, 2000);
})();

// Populate model selector from registry
fetch('/api/models', {headers: {'Accept': 'application/json'}})
    .then(function(r) { return r.json(); })
    .then(function(models) {
        var sel = document.getElementById('model-select');
        if (!sel || !Array.isArray(models)) return;
        models.forEach(function(m) {
            if (m.orphaned) return;
            var opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = m.id;
            sel.appendChild(opt);
        });
    })
    .catch(function(err) { console.warn('Failed to load models:', err); });
</script>
{{end}}
