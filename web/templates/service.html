{{define "content"}}
<h1>Service</h1>

<article>
    <header>vLLM Status</header>
    <div id="service-status"
         hx-get="/api/service/status"
         hx-trigger="load, every 3s"
         hx-swap="innerHTML">
        <p aria-busy="true">Loading...</p>
    </div>

    <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
        <div id="start-form">
            <select name="model_id" id="model-select" style="display:inline-block;width:auto;">
                <option value="">Select a model...</option>
            </select>
            <button hx-post="/api/service/start"
                    hx-include="#model-select"
                    hx-target="#service-action-result"
                    hx-swap="innerHTML">Start</button>
        </div>
        <button class="secondary" hx-post="/api/service/stop" hx-target="#service-action-result" hx-swap="innerHTML">Stop</button>
        <button class="secondary outline" hx-post="/api/service/restart" hx-target="#service-action-result" hx-swap="innerHTML">Restart</button>
    </div>
    <div id="service-action-result" style="margin-top:0.5rem;"></div>
</article>

<article>
    <header>
        Logs
        <span style="float:right;font-size:0.75rem;">
            <label style="display:inline;"><input type="checkbox" class="log-tail-toggle" checked> Auto-scroll</label>
        </span>
    </header>
    <div class="log-panel">
        <pre id="service-logs"
             style="max-height:400px;overflow-y:auto;font-size:0.75rem;padding:0.5rem;background:var(--pico-code-background-color);border-radius:0.25rem;"
             hx-get="/api/service/logs"
             hx-trigger="load"
             hx-swap="innerHTML"></pre>
        <div style="margin-top:0.25rem;display:flex;gap:0.5rem;">
            <button class="secondary outline log-copy-btn" style="padding:0.15rem 0.5rem;font-size:0.75rem;">Copy</button>
            <button class="secondary outline log-clear-btn" style="padding:0.15rem 0.5rem;font-size:0.75rem;">Clear</button>
        </div>
    </div>
</article>

<script>
// Populate model selector from registry
fetch('/api/models', {headers: {'Accept': 'application/json'}})
    .then(r => r.json())
    .then(models => {
        const sel = document.getElementById('model-select');
        if (!sel || !Array.isArray(models)) return;
        models.filter(m => !m.orphaned).forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = m.display_name || m.id;
            sel.appendChild(opt);
        });
    })
    .catch(err => console.warn('Failed to load models:', err));
</script>
{{end}}
