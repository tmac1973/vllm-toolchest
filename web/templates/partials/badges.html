{{/* Small shared bits of markup that more than one page renders. */}}

{{/* A model's VRAM estimate and how it fits. Takes a vramLabel. */}}
{{define "vram_label"}}{{if .Unknown}}<span title="{{.Why}}">—</span>{{else}}<span style="color:{{.Color}};" title="Per GPU at the configured tensor-parallel size">{{printf "%.1f" .PerGPUGB}} GB<br><small>{{.FitLabel}}</small></span>{{end}}{{end}}
