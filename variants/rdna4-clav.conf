# tcclaviger/vllm — the other hand-tuned RDNA4 stack.
#
# An alternative to radiance on the same silicon, and the only variant here
# that also covers gfx1200 (RX 9060 XT): the image declares
# PYTORCH_ROCM_ARCH=gfx1201;gfx1200, where radiance is gfx1201 only.
#
# Where radiance leans on Triton, this one replaces the stack with hand-written
# AOT HIP kernels -- attention, the gated-delta-net path, the quantized and
# block-FP8 GEMMs, the KV-cache write and the all-reduce. The author reports
# that removing the startup Triton compile takes a cold 27B TP4 start from
# 10-15 minutes to about 2:39, which is the difference you would notice first.
#
# Published as tcclaviger/vllm. An earlier name for this work was
# "vllm-rocm-rdna4-mxfp4"; that repository no longer exists.
#
# The image carries the Qwen-Next architecture (qwen4_exp) and the expert/PLE
# offload feature, which is what a 125B MoE with a 47.7 GB n-gram embedding
# table needs to fit on four 32 GB cards. The offload controls are CLI flags
# plus VLLM_PLE_CPU_OFFLOAD, so they are set per model rather than here.

VARIANT_ID='rdna4-clav'
VARIANT_LABEL='RDNA4 native-HIP (tcclaviger)'
VARIANT_SUMMARY='Hand-written HIP kernels for gfx1201/gfx1200. Very fast cold start.'
VARIANT_VENDOR='amd'
VARIANT_TIER='community'
VARIANT_DOC_URL='https://blog.robai.net/vllmdocs/'
VARIANT_DOC_LABEL='the tcclaviger/vllm docs'
VARIANT_NOTE='a ROCm/RDNA4 vLLM build whose attention, GEMM, KV-cache and all-reduce paths are hand-written AOT HIP kernels rather than Triton.'

# This variant follows :latest rather than naming a release, and it is the only
# one that does. The image and the checkpoints published for it move together
# and quickly -- three releases on 2026-09-28 alone -- and the author's model
# cards say to serve with :latest because "no other image reads this
# checkpoint". That is literal: an MTP head republished for 29.04.9 and later
# fails to load on 28.04.9 with a tensor size mismatch, which is how a pin two
# weeks old stopped a model that had been serving the day before.
#
# "Follows" is not "floats". The tag is resolved by install, rebuild and pull,
# never by quick, and the image it resolved to is given a local name and kept
# when the next one replaces it. See "Following a base image that moves" in
# setup.sh.
VARIANT_BASE_IMAGE='docker.io/tcclaviger/vllm:latest'
VARIANT_BASE_PULL='always'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
# With the base moving, the vLLM inside it cannot be written down here. It is
# read out of the image at build time: the tag is
# the author's own release numbering and says nothing about which vLLM is
# inside. 28.02.2 and 28.04.9 both carried 0.27.0.dev0+g55c98e370a, four
# releases apart; 29.06.1 carries 0.29.0.dev0+g2bdbbc8080.
VARIANT_VLLM_PIN='image'
# The author's release number is not in the image's labels or environment. It
# is a constant in the startup banner, so that is where it is read from. If
# the banner moves this prints nothing, and the release is simply not recorded.
VARIANT_BASE_RELEASE_CMD='grep -rhoE "_CLAV_VERSION = \"[^\"]+\"" /opt/vllm/lib/python*/site-packages/vllm/entrypoints | head -1 | cut -d\" -f2'

VARIANT_GFX_TARGETS='gfx1201 gfx1200'
VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='15'

VARIANT_VENV_ROOT='/opt/vllm'
# The image entrypoint runs `vllm serve "$@"` when given no tool flag, so it
# works as a launcher and keeps whatever it sets up in our log stream.
VARIANT_LAUNCHER='/app/tools/image_entrypoint.sh'
VARIANT_CAPS='SYS_PTRACE'

# The image offloads a checkpoint's per-layer embedding (n-gram) table to host
# RAM by default: measured on compute 2026-10-01, the 125B MoE started at TP=4
# with no VLLM_PLE_CPU_OFFLOAD set and logged "EngramConfig(cpu_offload=True)"
# and a 38.74 GiB pinned host table. Declared so the estimate counts the
# offload for such a checkpoint even when nothing sets the variable; setting
# VLLM_PLE_CPU_OFFLOAD=0 on a model still turns it off.
# It also offloads MoE experts to system RAM (--enable-expert-offload) for
# MXFP4 and W4A16 experts, which lets autoconfigure plan a model that does
# not fit on the cards; see plan/archive/autoconfigure/phase-15-expert-offload.md.
# It can also serve a PLE table from NVMe through a row cache in RAM
# (--ple-nvme-offload), which is how Flash-Next's card fits it on two R9700s.
VARIANT_CAPABILITIES='ple_offload_default expert_offload ple_nvme_offload'

# The image's author publishes checkpoints made for it: formats only it loads
# (mxfp4_16, rfi, rfa), MTP heads matched to its kernels. The recommendation
# feed shows theirs that fit this machine in a section of its own, above its
# rankings, rather than leaving them to compete on downloads with releases
# they are not comparable to.
VARIANT_FEATURED='tcclaviger'

KNOBS=''
