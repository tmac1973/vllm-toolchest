# tcclaviger/vllm — the other hand-tuned RDNA4 stack.
#
# An alternative to radiance on the same silicon, and the only variant here
# that also covers gfx1200 (RX 9060 XT): the image declares
# PYTORCH_ROCM_ARCH=gfx1201;gfx1200, where radiance is gfx1201 only.
#
# Where radiance leans on Triton, this one replaces the stack with hand-written
# AOT HIP kernels -- attention, the gated-delta-net path, the quantized and
# block-FP8 GEMMs, the KV-cache write and the all-reduce. The author reports
# that removing the startup Triton compile takes a cold 27B TP4 start from
# 10-15 minutes to about 2:39, which is the difference you would notice first.
#
# Published as tcclaviger/vllm. An earlier name for this work was
# "vllm-rocm-rdna4-mxfp4"; that repository no longer exists.

VARIANT_ID='rdna4-clav'
VARIANT_LABEL='RDNA4 native-HIP (tcclaviger)'
VARIANT_SUMMARY='Hand-written HIP kernels for gfx1201/gfx1200. Very fast cold start.'
VARIANT_VENDOR='amd'
VARIANT_TIER='community'
VARIANT_DOC_URL='https://blog.robai.net/vllmdocs/'
VARIANT_DOC_LABEL='the tcclaviger/vllm docs'
VARIANT_NOTE='a ROCm/RDNA4 vLLM build whose attention, GEMM, KV-cache and all-reduce paths are hand-written AOT HIP kernels rather than Triton.'

VARIANT_BASE_IMAGE='docker.io/tcclaviger/vllm:28.02.2'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
VARIANT_VLLM_PIN='v0.28.0'

VARIANT_GFX_TARGETS='gfx1201 gfx1200'
VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='15'

VARIANT_VENV_ROOT='/opt/vllm'
# The image entrypoint runs `vllm serve "$@"` when given no tool flag, so it
# works as a launcher and keeps whatever it sets up in our log stream.
VARIANT_LAUNCHER='/app/tools/image_entrypoint.sh'
VARIANT_CAPS='SYS_PTRACE'

KNOBS=''
