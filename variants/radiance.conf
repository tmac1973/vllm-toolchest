# vllm-radiance — the RDNA4 / gfx1201 image variant.
#
# Sourced by setup.sh and parsed by variants/variants.go. The grammar is a
# strict subset of bash: NAME='value', one per line, values ALWAYS single
# quoted. Single quotes make the value fully literal, so commas, double
# quotes, em-dashes, # and $ all pass through untouched -- the one character
# that cannot appear is the ASCII apostrophe. Use ASCII double quotes for
# inline quoting in prose. A lint test enforces this.
#
# Every key is VARIANT_-, GROUP_- or KNOB_-prefixed because setup.sh sources
# this file into its own shell: a bare ID= or VENDOR= would clobber a global.
#
# Knobs default to unset, which leaves the image's own baked-in default in
# place. KNOB_*_RECOMMENDED is a SEPARATE slot: it is what an "apply
# recommended settings" action would set, and "-" means the recommendation is
# to leave the image default alone.

VARIANT_ID='radiance'
VARIANT_LABEL='Radiance (RDNA4 / gfx1201)'
VARIANT_SUMMARY='Dense and hybrid-linear-attention FP8, tuned for 2x R9700 at TP=2'
VARIANT_VENDOR='amd'
VARIANT_TIER='tested'
VARIANT_DOC_URL='https://codeberg.org/StillDeadcode/vllm-radiance'
VARIANT_DOC_LABEL='vllm-radiance'
VARIANT_NOTE='a vLLM stack tuned for the AMD Radeon AI PRO R9700. Every switch below defaults to image default — leave it there unless you are debugging, so the values track upstream instead of being pinned here.'

VARIANT_BASE_IMAGE='docker.io/stilldeadcode/vllm-radiance:0.9.3'
VARIANT_DOCKERFILE='Dockerfile.radiance'
VARIANT_NEEDS_FLATTEN='1'
VARIANT_VLLM_PIN='v0.27.1'

VARIANT_GFX_TARGETS='gfx1201'
VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='20'

VARIANT_VENV_ROOT='/opt/vllm'
VARIANT_LAUNCHER='/opt/radiance_entrypoint.sh'
VARIANT_STAMP_FILE='/opt/radiance_version'
VARIANT_CAPS='SYS_PTRACE SYS_NICE'
VARIANT_ATTENTION_BACKENDS='R4D'

HOSTREQ_1='gfx|block|gfx1201|the radiance image is compiled for gfx1201 only'

# ── Knobs ───────────────────────────────────────────────────────────────────
# KNOBS order is authoritative for the UI, for env emission and for generated
# docs. Group assignment must be contiguous.

KNOBS='USE_R4D USE_R4D_AR USE_R4D_AR_QUANT PRESHUFFLE FUSE_RMS_QUANT SKINNY_GEMM DYNAMIC_DRAFT FAST_DRAFT DRAFT_TAU DRAFT_SCHEDULE RUN_BWTEST NUMA_BIND'

GROUP_KERNELS_TITLE=''
GROUP_KERNELS_NOTE=''
GROUP_DRAFTING_TITLE='Speculative drafting'
GROUP_DRAFTING_NOTE='Only applies to models started with a speculative config. Lossless either way: the target model verifies every drafted token with its own weights.'
GROUP_HOST_TITLE=''
GROUP_HOST_NOTE=''

KNOB_USE_R4D_ENV='RADIANCE_USE_R4D'
KNOB_USE_R4D_GROUP='KERNELS'
KNOB_USE_R4D_TYPE='select'
KNOB_USE_R4D_LABEL='R4D kernel library'
KNOB_USE_R4D_HELP='Master switch for the hand-written gfx1201 kernel library (libr4d): paged attention, the gated-delta-net scan, vision attention, the P2P all-reduce and the skinny GEMM. Off reverts every one of them to the stock path.'
KNOB_USE_R4D_VALUES='- 1 0'
KNOB_USE_R4D_RECOMMENDED='-'

KNOB_USE_R4D_AR_ENV='RADIANCE_USE_R4D_AR'
KNOB_USE_R4D_AR_GROUP='KERNELS'
KNOB_USE_R4D_AR_TYPE='select'
KNOB_USE_R4D_AR_LABEL='P2P all-reduce'
KNOB_USE_R4D_AR_HELP='The TP=2 peer-to-peer one-shot all-reduce. Bit-identical to RCCL either way; off keeps RCCL.'
KNOB_USE_R4D_AR_VALUES='- 1 0'
KNOB_USE_R4D_AR_RECOMMENDED='-'

KNOB_USE_R4D_AR_QUANT_ENV='RADIANCE_USE_R4D_AR_QUANT'
KNOB_USE_R4D_AR_QUANT_GROUP='KERNELS'
KNOB_USE_R4D_AR_QUANT_TYPE='select'
KNOB_USE_R4D_AR_QUANT_LABEL='All-reduce quantization'
KNOB_USE_R4D_AR_QUANT_HELP='Compresses large (prefill) all-reduce payloads. This one is NOT bit-identical to RCCL — turn it off if you need the exact bf16 all-reduce.'
KNOB_USE_R4D_AR_QUANT_VALUES='- 1 0'
KNOB_USE_R4D_AR_QUANT_LABEL_1='on (not bit-identical)'
KNOB_USE_R4D_AR_QUANT_LABEL_0='off (exact bf16)'
KNOB_USE_R4D_AR_QUANT_RECOMMENDED='-'

KNOB_PRESHUFFLE_ENV='RADIANCE_PRESHUFFLE'
KNOB_PRESHUFFLE_GROUP='KERNELS'
KNOB_PRESHUFFLE_TYPE='select'
KNOB_PRESHUFFLE_LABEL='Preshuffled FP8 GEMM'
KNOB_PRESHUFFLE_HELP='Preshuffled weight layout for the block-FP8 GEMM.'
KNOB_PRESHUFFLE_VALUES='- 1 0'
KNOB_PRESHUFFLE_RECOMMENDED='-'

KNOB_FUSE_RMS_QUANT_ENV='RADIANCE_FUSE_RMS_QUANT'
KNOB_FUSE_RMS_QUANT_GROUP='KERNELS'
KNOB_FUSE_RMS_QUANT_TYPE='select'
KNOB_FUSE_RMS_QUANT_LABEL='Fused RMSNorm + quant'
KNOB_FUSE_RMS_QUANT_HELP='Fused RMSNorm + group-FP8-quant path.'
KNOB_FUSE_RMS_QUANT_VALUES='- 1 0'
KNOB_FUSE_RMS_QUANT_RECOMMENDED='-'

KNOB_SKINNY_GEMM_ENV='RADIANCE_SKINNY_GEMM'
KNOB_SKINNY_GEMM_GROUP='KERNELS'
KNOB_SKINNY_GEMM_TYPE='select'
KNOB_SKINNY_GEMM_LABEL='Skinny bf16 GEMM'
KNOB_SKINNY_GEMM_HELP='Routes small-M bf16 projections to the R4D split-K kernel. "all" adds shapes that differ from rocBLAS at a bf16 ULP — notably the gated-delta-net in_proj_ba.'
KNOB_SKINNY_GEMM_VALUES='- 1 all 0'
KNOB_SKINNY_GEMM_LABEL_1='on (default shapes)'
KNOB_SKINNY_GEMM_LABEL_ALL='all shapes'
KNOB_SKINNY_GEMM_RECOMMENDED='-'

KNOB_DYNAMIC_DRAFT_ENV='RADIANCE_DYNAMIC_DRAFT'
KNOB_DYNAMIC_DRAFT_GROUP='DRAFTING'
KNOB_DYNAMIC_DRAFT_TYPE='select'
KNOB_DYNAMIC_DRAFT_LABEL='Dynamic draft depth'
KNOB_DYNAMIC_DRAFT_HELP='Per-request MTP draft depth chosen by a confidence gate, plus verbatim n-gram tails. Off is byte-identical stock MTP.'
KNOB_DYNAMIC_DRAFT_VALUES='- 1 0'
KNOB_DYNAMIC_DRAFT_RECOMMENDED='-'

KNOB_FAST_DRAFT_ENV='RADIANCE_FAST_DRAFT'
KNOB_FAST_DRAFT_GROUP='DRAFTING'
KNOB_FAST_DRAFT_TYPE='select'
KNOB_FAST_DRAFT_LABEL='Fast draft head'
KNOB_FAST_DRAFT_HELP='The 2-bit draft head with exact rerank, plus 4-bit dflash drafter weights. Keep in sync with the confidence gate below: radiance tunes 0.28 for the 2-bit head and 0.35 for the stock bf16 one.'
KNOB_FAST_DRAFT_VALUES='- 1 0'
KNOB_FAST_DRAFT_LABEL_1='on (2-bit head)'
KNOB_FAST_DRAFT_LABEL_0='off (stock bf16 head)'
KNOB_FAST_DRAFT_RECOMMENDED='-'

KNOB_DRAFT_TAU_ENV='RADIANCE_DRAFT_TAU'
KNOB_DRAFT_TAU_GROUP='DRAFTING'
KNOB_DRAFT_TAU_TYPE='text'
KNOB_DRAFT_TAU_LABEL='Draft confidence (tau)'
KNOB_DRAFT_TAU_HELP='Confidence gate for the draft depth. 0.28 is tuned for the 2-bit head, 0.35 for the stock bf16 one — leaving them crossed drafts deeper than the head pays for. Blank uses the image default.'
KNOB_DRAFT_TAU_PLACEHOLDER='image default'
KNOB_DRAFT_TAU_RECOMMENDED='-'

KNOB_DRAFT_SCHEDULE_ENV='RADIANCE_DRAFT_SCHEDULE'
KNOB_DRAFT_SCHEDULE_GROUP='DRAFTING'
KNOB_DRAFT_SCHEDULE_TYPE='text'
KNOB_DRAFT_SCHEDULE_LABEL='Draft schedule'
KNOB_DRAFT_SCHEDULE_HELP='Caps serial MTP forwards by batch size, as batch:depth pairs. Blank uses the image default.'
KNOB_DRAFT_SCHEDULE_PLACEHOLDER='1:8,2:7,4:6,8:5,16:4'
KNOB_DRAFT_SCHEDULE_RECOMMENDED='-'

KNOB_RUN_BWTEST_ENV='RADIANCE_RUN_BWTEST'
KNOB_RUN_BWTEST_GROUP='HOST'
KNOB_RUN_BWTEST_TYPE='select'
KNOB_RUN_BWTEST_LABEL='Startup bandwidth sweep'
KNOB_RUN_BWTEST_HELP='Topology, P2P access matrix, NUMA distances and peak copy bandwidth per agent pair at startup. Backgrounded and about a second, so it never delays the serve.'
KNOB_RUN_BWTEST_VALUES='- 1 0'
# A diagnostic, not something to leave on: it belongs in a troubleshooting run.
KNOB_RUN_BWTEST_RECOMMENDED='-'

KNOB_NUMA_BIND_ENV='RADIANCE_NUMA_BIND'
KNOB_NUMA_BIND_GROUP='HOST'
KNOB_NUMA_BIND_TYPE='text'
KNOB_NUMA_BIND_LABEL='NUMA binding'
KNOB_NUMA_BIND_HELP='Pin the vLLM fleet to the GPU-local NUMA node(s). No-op on single-node hosts. "auto" detects; explicit nodes also work (e.g. 0 or 0,1). Needs the SYS_NICE capability.'
KNOB_NUMA_BIND_PLACEHOLDER='off — try: auto'
# A no-op on single-socket hosts, and it needs a capability the compose file
# has to grant. Not something to switch on blind.
KNOB_NUMA_BIND_RECOMMENDED='-'
