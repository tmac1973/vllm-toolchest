# The portable from-source build: Fedora + ROCm or CUDA, vLLM compiled here.
#
# TRANSITIONAL. "generic" is really two variants wearing one name -- the
# Dockerfile and the device wiring are chosen by the detected GPU vendor, not
# by this manifest -- which is exactly why it splits into rocm-source and
# cuda-source later in this work. Until then the vendor-dependent fields are
# deliberately absent rather than guessed, and setup.sh keeps deriving them
# from GPU_VENDOR as it does today.
#
# It carries no knobs. That is not a gap: a stock vLLM build has no
# image-specific feature switches to expose, and the runtime environment table
# in Settings already covers the VLLM_* variables. An empty KNOBS is a
# first-class case -- the Settings panel renders nothing at all rather than an
# empty box.

VARIANT_ID='generic'
VARIANT_LABEL='Generic (from source)'
VARIANT_SUMMARY='Builds vLLM from source and tracks main. Portable across NVIDIA and AMD.'
VARIANT_TIER='tested'
VARIANT_DOC_URL='https://github.com/vllm-project/vllm'
VARIANT_DOC_LABEL='vLLM'
VARIANT_NOTE='a vLLM stack compiled from source against the GPU vendor detected at install time.'

VARIANT_VLLM_PIN='main'
VARIANT_PRIORITY='10'

VARIANT_VENV_ROOT='/opt/vllm-venv'
VARIANT_LAUNCHER='vllm serve'

KNOBS=''
