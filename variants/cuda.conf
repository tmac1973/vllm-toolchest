# The vLLM project's own image. The reference platform.
#
# No tuned community fork exists for mainstream NVIDIA silicon because none is
# needed: this is the hardware vLLM is developed against, and every other
# variant here is best understood as working around something this one gets for
# free.
#
# Preferred over cuda-source in the menu because it is a pull rather than a
# build, and it is the same stack either way.

VARIANT_ID='cuda'
VARIANT_LABEL='CUDA (vLLM official)'
VARIANT_SUMMARY='The vLLM project official image. The reference platform.'
VARIANT_VENDOR='nvidia'
VARIANT_TIER='community'
VARIANT_DOC_URL='https://hub.docker.com/r/vllm/vllm-openai'
VARIANT_DOC_LABEL='vllm/vllm-openai'
VARIANT_NOTE='the vLLM project official release image.'

VARIANT_BASE_IMAGE='docker.io/vllm/vllm-openai:v0.29.0'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
VARIANT_VLLM_PIN='v0.29.0'

# Compute capabilities the image is compiled for, from TORCH_CUDA_ARCH_LIST:
# 8.0 8.7 8.9 9.0 10.0 11.0 12.0 -- Ampere through Blackwell. Deliberately not
# listed as targets: detection reports one capability and matching it against
# ten strings would reject a card the image supports through PTX. The compute
# capability is what separates gb10 from everything else, and that variant
# names its own.
VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='5'

# vLLM is installed system-wide here rather than into a venv.
VARIANT_VENV_ROOT='/usr/local'
VARIANT_CAPS='SYS_PTRACE'

KNOBS=''
