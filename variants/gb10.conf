# NVIDIA DGX Spark (GB10).
#
# The one place NVIDIA is not the vanilla path: arm64, compute capability
# sm_121a and CUDA 13 all at once, which breaks the x86 and datacentre-GPU
# assumptions the stock images are built on. The image declares
# TORCH_CUDA_ARCH_LIST=12.1a and will not run on anything else.
#
# Matching is on the host architecture as much as the GPU: nothing else here is
# arm64, so a machine that is both aarch64 and sm_121 is a DGX Spark.

VARIANT_ID='gb10'
VARIANT_LABEL='DGX Spark (GB10)'
VARIANT_SUMMARY='NVIDIA DGX Spark: arm64, sm_121a, CUDA 13.'
VARIANT_VENDOR='nvidia'
VARIANT_TIER='experimental'
VARIANT_DOC_URL='https://github.com/timothystewart6/vllm-gb10'
VARIANT_DOC_LABEL='vllm-gb10'
VARIANT_NOTE='a vLLM build for the DGX Spark, pinning every input by commit or digest.'

VARIANT_BASE_IMAGE='ghcr.io/timothystewart6/vllm-gb10:v0.28.0-gb10.2'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
VARIANT_VLLM_PIN='v0.28.0'

VARIANT_HOST_ARCH='aarch64'
VARIANT_PRIORITY='15'

VARIANT_VENV_ROOT='/usr/local'
VARIANT_CAPS='SYS_PTRACE'

HOSTREQ_1='arch|block|aarch64|the DGX Spark image is built for arm64 and will not run on x86_64'
HOSTREQ_2='compute_cap|warn|sm_121|this image targets compute capability 12.1a; the detected GPU reports something else'

KNOBS=''
