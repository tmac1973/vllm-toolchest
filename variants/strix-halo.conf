# Ryzen AI MAX (Strix Halo, gfx1151).
#
# Built on TheRock nightlies, and for a while the only working vLLM path for
# this part. Worth choosing over the general rocm variant on gfx1151 because it
# is compiled for that target alone -- the image declares
# PYTORCH_ROCM_ARCH=gfx1151 and nothing else.

VARIANT_ID='strix-halo'
VARIANT_LABEL='Strix Halo (gfx1151)'
VARIANT_SUMMARY='Ryzen AI MAX / Strix Halo, built on TheRock nightlies.'
VARIANT_VENDOR='amd'
VARIANT_TIER='community'
VARIANT_DOC_URL='https://hub.docker.com/r/kyuz0/vllm-therock-gfx1151'
VARIANT_DOC_LABEL='kyuz0/vllm-therock-gfx1151'
VARIANT_NOTE='a vLLM stack built on TheRock nightlies for the Ryzen AI MAX APU.'

VARIANT_BASE_IMAGE='docker.io/kyuz0/vllm-therock-gfx1151:rocm10.0.0-torch2.11.0-vllm0.28.0'
# The tags install and rebuild offer, newest first, as an extended regular
# expression over this repository's tag names. The first is the default and
# the base image above is only the fallback for when the registry cannot be
# asked. Narrow enough to leave out nightlies, release candidates and builds
# for other hardware.
VARIANT_BASE_TAGS='^rocm[0-9.]+-torch[0-9.]+-vllm[0-9.]+$'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
# From the tag, which names vLLM explicitly (rocm10.0.0-torch2.11.0-vllm0.28.0).
# Not confirmed by a build, but the tag is the author stating it rather than a
# number that happens to look like a version.
# Whichever tag is chosen, the vLLM inside it is read out of the image.
VARIANT_VLLM_PIN='image'

VARIANT_GFX_TARGETS='gfx1151'
VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='15'

VARIANT_VENV_ROOT='/opt/venv'
VARIANT_CAPS='SYS_PTRACE'

# Not declared, so only "auto" is offered. The scoping note claimed this image
# exposes TRITON_ATTN, ROCM_ATTN and ROCM_AITER_UNIFIED_ATTN and deliberately
# omits ROCM_AITER_FA, whose paged-attention decode kernel has no Navi
# implementation. That was never verified, and an unverified backend list is
# how an engine aborts minutes into a load. Confirm it on real hardware -- the
# engine log prints "out of potential backends: [...]" -- then fill it in.
#VARIANT_ATTENTION_BACKENDS='TRITON_ATTN ROCM_ATTN ROCM_AITER_UNIFIED_ATTN'

KNOBS=''
