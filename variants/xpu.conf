# Intel Arc Pro B-series (Battlemage).
#
# Intel maintains this; mainline vLLM XPU has broken GDN kernels, so this is
# the working path rather than an optimisation. Do not substitute
# intel/vllm:*-xpu -- users following Intel own docs onto that image hit
# "RuntimeError: PyTorch was compiled without CUDA support" on a B60.
#
# The heaviest host integration of the set, and the assumptions differ from
# every ROCm path. Each release pins the whole stack together -- host OS, vLLM,
# PyTorch, oneAPI, oneCCL, the user-mode and kernel-mode drivers, GuC firmware
# -- and a mismatch fails at runtime rather than at build. Intel own flow is
# Ubuntu 24.04, then their offline installer for kernel, firmware, driver and
# tools, then this image.
#
# Alchemist (A770) is NOT this image. It needs intelanalytics/multi-arc-serving,
# an ipex-llm lineage that is poorly maintained, so the host check below warns
# when the detected part does not look like Battlemage.

VARIANT_ID='xpu'
VARIANT_LABEL='Intel Arc Pro (Battlemage)'
VARIANT_SUMMARY='Intel Arc Pro B60/B70. Needs Intel own driver and firmware stack.'
VARIANT_VENDOR='intel'
VARIANT_TIER='community'
VARIANT_DOC_URL='https://hub.docker.com/r/intel/llm-scaler-vllm'
VARIANT_DOC_LABEL='intel/llm-scaler-vllm'
VARIANT_NOTE='Intel vendor-maintained vLLM for Arc Pro, with oneAPI and oneCCL pinned to the release.'

VARIANT_BASE_IMAGE='docker.io/intel/llm-scaler-vllm:0.26.0-b2'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
VARIANT_VLLM_PIN='v0.26.0'

VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='15'

VARIANT_VENV_ROOT='/opt/venv'
VARIANT_CAPS='SYS_PTRACE'

# The image entrypoint sources oneAPI before exec-ing the server, and without
# that vLLM cannot find its libraries. Copied from the published image config
# rather than reconstructed, so it stays whatever Intel ships.
VARIANT_LAUNCHER_1='bash'
VARIANT_LAUNCHER_2='-c'
VARIANT_LAUNCHER_3='source /opt/intel/oneapi/setvars.sh --force && source /opt/intel/oneapi/ccl/2021.15/env/vars.sh --force && exec vllm serve "$@"'
VARIANT_LAUNCHER_4='--'

# Known Battlemage PCI device ids. A warning rather than a block on purpose:
# the list will grow as Intel ships more of the family, and nobody here can
# test any of it, so a part we do not recognise should say so and continue
# rather than refuse to install.
HOSTREQ_1='pci_id|warn|e202 e20b e20c e20d e210 e211 e212 e215 e216|the detected Intel GPU is not a device id this image is known to serve; Alchemist (A770) in particular needs a different image entirely'

KNOBS=''
