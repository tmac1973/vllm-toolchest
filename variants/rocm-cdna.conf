# AMD's own vLLM build for Instinct / CDNA accelerators.
#
# The same repository as the rocm variant, a different image: AMD publishes
# RDNA and CDNA separately because they are compiled for different targets.
# Splitting them here rather than picking one keeps the architecture list
# honest -- a single "rocm" variant claiming both would be built for neither.

VARIANT_ID='rocm-cdna'
VARIANT_LABEL='ROCm CDNA (AMD prebuilt)'
VARIANT_SUMMARY='AMD official build for Instinct accelerators (MI200, MI300, MI350).'
VARIANT_VENDOR='amd'
VARIANT_TIER='community'
VARIANT_DOC_URL='https://hub.docker.com/r/rocm/vllm'
VARIANT_DOC_LABEL='rocm/vllm'
VARIANT_NOTE='AMD official ROCm vLLM build for CDNA datacentre accelerators.'

VARIANT_BASE_IMAGE='docker.io/rocm/vllm:rocm7.14.1_cdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
# The tag says vllm_0.23.0. The RDNA image from this same build reports
# 0.23.1.dev1, so expect a dev version here too; the build compares on the
# minor, which matches either way. If it ever fails, set VARIANT_TUNER_REF
# to the commit after the +g in the reported version.
VARIANT_VLLM_PIN='v0.23.0'

# Exactly what the image declares in PYTORCH_ROCM_ARCH: MI200, MI300, MI350.
VARIANT_GFX_TARGETS='gfx90a gfx942 gfx950'
VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='5'

VARIANT_VENV_ROOT='/opt/python'
VARIANT_CAPS='SYS_PTRACE'

KNOBS=''
