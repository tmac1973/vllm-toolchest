# AMD's own arch-specific vLLM build for Instinct / CDNA accelerators.
#
# The same repository as the rocm variant, a different image. This used to be
# the only way to serve CDNA from AMD's own builds, because the arch-specific
# tags were all AMD published for these cards.
#
# That is no longer true: since 2026-09-21 the rocm variant points at AMD's
# unified image, whose PYTORCH_ROCM_ARCH genuinely covers gfx90a, gfx942 and
# gfx950 alongside RDNA. So an Instinct machine now matches both and is
# offered both, which is the point -- they are real alternatives rather than
# one being wrong:
#
#   rocm       ROCm 10.0.0, PyTorch 2.12, vLLM 0.27.0 -- a far newer engine,
#              and the one whose log output the measured-VRAM feature can
#              actually read
#   rocm-cdna  ROCm 7.14.1, PyTorch 2.11, vLLM 0.23.0 -- an older but
#              arch-specific build, and the one that carries AITER for
#              gfx942/gfx950 in a form this manifest can describe
#
# rocm is ranked one point higher so it takes the recommended slot by default;
# nothing stops someone picking this from the menu.

VARIANT_ID='rocm-cdna'
VARIANT_LABEL='ROCm CDNA (AMD prebuilt)'
VARIANT_SUMMARY='AMD official build for Instinct accelerators (MI200, MI300, MI350).'
VARIANT_VENDOR='amd'
VARIANT_TIER='community'
VARIANT_DOC_URL='https://hub.docker.com/r/rocm/vllm'
VARIANT_DOC_LABEL='rocm/vllm'
VARIANT_NOTE='AMD official ROCm vLLM build for CDNA datacentre accelerators.'

VARIANT_BASE_IMAGE='docker.io/rocm/vllm:rocm7.14.1_cdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0'
# The tags install and rebuild offer, newest first, as an extended regular
# expression over this repository's tag names. The first is the default and
# the base image above is only the fallback for when the registry cannot be
# asked. Narrow enough to leave out nightlies, release candidates and builds
# for other hardware.
VARIANT_BASE_TAGS='^rocm[0-9.]+_cdna_ubuntu[0-9.]+_py[0-9.]+[-_]pytorch_[0-9.]+_vllm[-_][0-9.]+$'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
# The tag says vllm_0.23.0. The RDNA image from this same build reports
# 0.23.1.dev1, so expect a dev version here too; the build compares on the
# minor, which matches either way.
# Whichever tag is chosen, the vLLM inside it is read out of the image.
VARIANT_VLLM_PIN='image'

# Exactly what the image declares in PYTORCH_ROCM_ARCH: MI200, MI300, MI350.
VARIANT_GFX_TARGETS='gfx90a gfx942 gfx950'
VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='5'

VARIANT_VENV_ROOT='/opt/python'
VARIANT_CAPS='SYS_PTRACE'

KNOBS=''
