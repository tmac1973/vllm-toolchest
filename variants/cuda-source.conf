# vLLM installed from PyPI onto NVIDIA CUDA.
#
# The portable NVIDIA path: the CUDA devel image plus a pip install of vLLM,
# which ships prebuilt wheels for NVIDIA, so this is far quicker than the AMD
# source build despite the name.
#
# Was called "generic" before the variants gained manifests. That name covered
# this and rocm-source at once, with the GPU found at install time deciding
# which you got; setup.sh migrates an existing install onto the right one.

VARIANT_ID='cuda-source'
VARIANT_LABEL='CUDA (built here)'
VARIANT_SUMMARY='Installs vLLM from PyPI onto the CUDA devel image. Tracks the latest release.'
VARIANT_VENDOR='nvidia'
VARIANT_TIER='tested'
VARIANT_DOC_URL='https://github.com/vllm-project/vllm'
VARIANT_DOC_LABEL='vLLM'
VARIANT_NOTE='a vLLM stack installed from PyPI onto the NVIDIA CUDA devel image.'

VARIANT_DOCKERFILE='Dockerfile.cuda'
VARIANT_VLLM_PIN='main'

VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='0'

VARIANT_VENV_ROOT='/opt/vllm-venv'
VARIANT_CAPS='SYS_PTRACE'

KNOBS=''
