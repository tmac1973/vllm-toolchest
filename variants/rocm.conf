# AMD's own vLLM build for RDNA cards.
#
# The prebuilt counterpart to rocm-source: same hardware, no compile. AMD
# maintains it, and its RDNA image is built for the whole family --
# PYTORCH_ROCM_ARCH in the image reads gfx1100 through gfx1201 -- so it is the
# general AMD fallback that the card-specific variants are compared against.
#
# Because it covers RDNA4 as well, radiance and rdna4-clav both outrank it on
# a gfx1201 machine: they name one architecture, this names ten.

VARIANT_ID='rocm'
VARIANT_LABEL='ROCm (AMD prebuilt)'
VARIANT_SUMMARY='AMD official build for RDNA3 and RDNA4. Fast install, no compile.'
VARIANT_VENDOR='amd'
VARIANT_TIER='community'
VARIANT_DOC_URL='https://hub.docker.com/r/rocm/vllm'
VARIANT_DOC_LABEL='rocm/vllm'
VARIANT_NOTE='AMD official ROCm vLLM build, covering the RDNA3 and RDNA4 families.'

VARIANT_BASE_IMAGE='docker.io/rocm/vllm:rocm7.14.1_rdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
VARIANT_VLLM_PIN='v0.23.0'

# Exactly what the image declares in PYTORCH_ROCM_ARCH. Not guessed.
VARIANT_GFX_TARGETS='gfx1100 gfx1101 gfx1102 gfx1103 gfx1150 gfx1151 gfx1152 gfx1153 gfx1200 gfx1201'
VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='5'

# Python lives under /opt/python here, not in a venv.
VARIANT_VENV_ROOT='/opt/python'
VARIANT_CAPS='SYS_PTRACE'

KNOBS=''
