# AMD's own vLLM build, covering RDNA and CDNA in one image.
#
# AMD publishes two shapes of tag: architecture-specific ones (…_rdna_…,
# …_cdna_…) and an unsuffixed unified build. The unified one is easy to miss
# precisely because its name says nothing about architecture — but
# PYTORCH_ROCM_ARCH in the image lists thirteen targets spanning both
# families, and it ships a vLLM four minor versions ahead of the newest
# arch-specific tag (0.27.0 against 0.23.0, as of 2026-09-21).
#
# That gap is not cosmetic. vLLM 0.23 does not print the "Actual usage is …
# for consumed memory" line, so RunMeasurement.Complete() is never satisfied
# and a start on the 0.23 image yields no usable measurement at all — the
# panel goes on showing whatever the previous engine reported. Found on a real
# start, 2026-09-21. See plan/phase-14-measured-vram.md.
#
# Because it covers RDNA4 as well, radiance and rdna4-clav both outrank it on
# a gfx1201 machine: they name one architecture, this names thirteen.

VARIANT_ID='rocm'
VARIANT_LABEL='ROCm (AMD prebuilt)'
# "no local compile" rather than "no compile": the build does not compile vLLM,
# but a start still does its own torch.compile work. See the timing note below.
VARIANT_SUMMARY='AMD official build for RDNA and CDNA. Fast install, no local compile.'
VARIANT_VENDOR='amd'
# Built, served and answered on an RX 7900 XTX (gfx1100) on 2026-09-21 against
# this base: Dockerfile.prebuilt, a 4B AWQ checkpoint at max_model_len=131072
# with fp8 KV, and a /v1/chat/completions round trip that returned tokens.
#
# The image reports vllm 0.27.1.dev5+gf46a9dfe2.d20260827.rocm100 -- the tag
# understates, exactly as the previous base's did, and the build's
# minor-version assertion passes either way.
#
# Re-verified on that start rather than carried across from the old image: the
# engine offered "out of potential backends: ['ROCM_ATTN', 'TRITON_ATTN']",
# which is what VARIANT_ATTENTION_BACKENDS below claims. ROCm 10.0.0 runs on
# gfx1100; that was the open risk in moving to this base and it did not bite.
#
# Startup is NOT fast, and the summary's "no local compile" is about the build:
#
#   init engine took 200.27 s (compilation: 53.23 s)
#
# against 177.46 s (140.19 s) on rocm-source and 56.66 s (44.74 s) on the
# previous 0.23 base. Compilation genuinely fell; total init rose anyway, so
# roughly 147 s goes somewhere else. All three figures are first starts after
# an image change, with the compile cache cold for that engine version, so
# none of them is a steady-state number. See plan/todo.md.
VARIANT_TIER='tested'
VARIANT_DOC_URL='https://hub.docker.com/r/rocm/vllm'
VARIANT_DOC_LABEL='rocm/vllm'
VARIANT_NOTE='AMD official ROCm vLLM build, covering the RDNA and CDNA families.'

VARIANT_BASE_IMAGE='docker.io/rocm/vllm:rocm10.0.0_ubuntu24.04_py3.14_pytorch_2.12.0_vllm_0.27.0'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
# v0.27.0 is a real upstream tag, so the tuner script fetches against it and no
# VARIANT_TUNER_REF is needed. The previous base needed one: its tag said
# 0.23.0 while the image reported 0.23.1.dev1+g9ddef7117, and no v0.23.1 tag
# exists. Expect this tag to understate too — the build compares on the minor,
# which matches either way, and prints a note when they differ.
VARIANT_VLLM_PIN='v0.27.0'

# Exactly what the image declares in PYTORCH_ROCM_ARCH. Not guessed.
# gfx90a/gfx942/gfx950 are MI200/MI300/MI350, so an Instinct box matches this
# variant *and* rocm-cdna and is offered both — see rocm-cdna.conf.
VARIANT_GFX_TARGETS='gfx90a gfx942 gfx950 gfx1100 gfx1101 gfx1102 gfx1103 gfx1150 gfx1151 gfx1152 gfx1153 gfx1200 gfx1201'
VARIANT_HOST_ARCH='x86_64'
# One above rocm-cdna. Both name architectures, so both score 1000, and
# matching_variants sorts on that with plain `sort -rn`, which is not stable:
# at equal scores the recommended arrow would land arbitrarily on an Instinct
# machine. This breaks the tie towards the newer engine deliberately. Still
# below rdna4-clav (15) and radiance (20), which must keep winning on gfx1201.
VARIANT_PRIORITY='6'

# Python lives under /opt/python here, not in a venv. Confirmed against this
# base: UV_PYTHON=/opt/python/bin/python and
# SITE_PACKAGES=/opt/python/lib/python3.14/site-packages.
VARIANT_VENV_ROOT='/opt/python'

# Verified on an RX 7900 XTX running the previous image from this repository:
# the engine reported "out of potential backends: ['ROCM_ATTN',
# 'TRITON_ATTN']" for AttentionType.DECODER, with AITER absent.
#
# This base declares AITER_ROCM_ARCH=gfx942;gfx950 — so AITER is compiled for
# CDNA but still not for any RDNA target, and an RDNA card sees the same two
# backends. A manifest lists one set per variant and cannot vary it per
# architecture, so this stays the conservative pair that works everywhere the
# variant runs. An Instinct owner who wants the AITER paths should choose
# rocm-cdna, or this list needs to become per-architecture first.
VARIANT_ATTENTION_BACKENDS='ROCM_ATTN TRITON_ATTN'
BACKEND_ROCM_ATTN_LABEL='ROCM_ATTN — the ROCm attention path, what vLLM picks here by default'
BACKEND_TRITON_ATTN_LABEL='TRITON_ATTN — the portable Triton implementation'
VARIANT_CAPS='SYS_PTRACE'

KNOBS=''
