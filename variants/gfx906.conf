# Vega 20: MI50, MI60, Radeon VII.
#
# Upstream vLLM dropped gfx906 years ago; this fork keeps it alive, which
# matters because these cards are the cheapest 16-32 GB of HBM anyone can buy
# second hand. The successor to nlzy/vllm-gfx906, which is archived.
#
# Pass --dtype float16 when serving. bf16 is not native on gfx906 and falls
# back to fp32, which costs both memory and speed -- set it in the model's
# launch config rather than discovering it from a slow first run.

VARIANT_ID='gfx906'
VARIANT_LABEL='Vega 20 (gfx906)'
VARIANT_SUMMARY='MI50, MI60 and Radeon VII. Serve with --dtype float16, not bf16.'
VARIANT_VENDOR='amd'
VARIANT_TIER='community'
VARIANT_DOC_URL='https://github.com/ai-infos/vllm-gfx906-mobydick'
VARIANT_DOC_LABEL='vllm-gfx906-mobydick'
VARIANT_NOTE='a vLLM fork keeping gfx906 alive after upstream dropped it.'

VARIANT_BASE_IMAGE='docker.io/aiinfos/vllm-gfx906-mobydick:v0.23.1rc0.x-rocm7.2.1-pytorch2.11.0'
VARIANT_DOCKERFILE='Dockerfile.prebuilt'
VARIANT_VLLM_PIN='v0.23.1rc0'

VARIANT_GFX_TARGETS='gfx906'
VARIANT_HOST_ARCH='x86_64'
VARIANT_PRIORITY='15'

# This image has no VIRTUAL_ENV and its PATH names no venv, so vLLM is
# installed against the system interpreter. vllmctl probes every declared root
# and both historical defaults, so a wrong guess here costs the tuner and the
# bitsandbytes check rather than the ability to serve.
VARIANT_VENV_ROOT='/usr/local'
VARIANT_CAPS='SYS_PTRACE'

KNOBS=''
