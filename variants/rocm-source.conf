# vLLM built from source against AMD ROCm.
#
# The portable AMD path: Fedora + the ROCm packages + a vLLM compiled here,
# tracking main. Slow to build and the widest model support, because nothing is
# pinned to a release somebody else froze.
#
# Was called "generic" before the variants gained manifests. That name covered
# this and cuda-source at once, with the GPU found at install time deciding
# which you got; setup.sh migrates an existing install onto the right one.

VARIANT_ID='rocm-source'
VARIANT_LABEL='ROCm (built from source)'
VARIANT_SUMMARY='Builds vLLM from source and tracks main. Widest model support, long build.'
VARIANT_VENDOR='amd'
VARIANT_TIER='tested'
VARIANT_DOC_URL='https://github.com/vllm-project/vllm'
VARIANT_DOC_LABEL='vLLM'
VARIANT_NOTE='a vLLM stack compiled from source against AMD ROCm.'

VARIANT_DOCKERFILE='Dockerfile.rocm'
VARIANT_VLLM_PIN='main'

# No VARIANT_GFX_TARGETS: the build is parameterised by GPU_ARCH, so it
# targets whatever card was detected rather than one architecture.
VARIANT_HOST_ARCH='x86_64'
# Lowest priority on purpose. It runs on any AMD card, so a variant that names
# a narrower target is a better match wherever both apply.
VARIANT_PRIORITY='0'

VARIANT_VENV_ROOT='/opt/vllm-venv'
VARIANT_CAPS='SYS_PTRACE'

KNOBS=''
